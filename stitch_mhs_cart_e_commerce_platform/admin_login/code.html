<body class="font-body-md text-on-background flex items-center justify-center p-margin-mobile">
<!-- Atmospheric Background Elements -->
<div class="floating-accent top-[-100px] right-[-50px]"></div>
<div class="floating-accent bottom-[-100px] left-[-50px]"></div>
<main class="w-full max-w-[440px] z-10">
<!-- Branding Anchor -->
<div class="flex flex-col items-center mb-lg">
<div class="w-16 h-16 bg-primary rounded-xl flex items-center justify-center mb-sm shadow-lg shadow-primary/20">
<span class="material-symbols-outlined text-on-primary text-[32px]" data-icon="admin_panel_settings">admin_panel_settings</span>
</div>
<h1 class="font-display text-headline-lg text-primary tracking-tight">MHS CART</h1>
<p class="font-label-lg text-secondary tracking-widest uppercase mt-xs">Admin Management</p>
</div>
<!-- Login Card -->

<div class="text-center">
<h2 class="font-headline-sm text-on-surface">Security Access</h2>
<p class="font-body-sm text-secondary mt-1">Authorized personnel only</p>
</div>
<form action="#" class="flex flex-col gap-sm" onsubmit="return false;">
<!-- Identity Field -->
<div class="flex flex-col gap-xs">
<label class="font-label-lg text-on-surface-variant ml-1" for="admin-id">Admin ID</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors" data-icon="person">person</span>
<input class="recessed-input w-full h-[54px] rounded-xl pl-12 pr-4 border-outline-variant outline-none font-body-md" id="admin-id" placeholder="username@mhscart.com" type="text"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-xs">
<label class="font-label-lg text-on-surface-variant ml-1" for="password">Secret Key</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors" data-icon="lock">lock</span>
<input class="recessed-input w-full h-[54px] rounded-xl pl-12 pr-4 border-outline-variant outline-none font-body-md" id="password" placeholder="••••••••••••" type="password"/>
</div>
</div>
<!-- 2FA Field -->
<div class="flex flex-col gap-xs">
<label class="font-label-lg text-on-surface-variant ml-1" for="tfa-code">2-Factor Authentication</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors" data-icon="security">security</span>
<input class="recessed-input w-full h-[54px] rounded-xl pl-12 pr-4 border-outline-variant outline-none font-body-md tracking-[0.2em] font-bold" id="tfa-code" maxlength="6" placeholder="000 000" type="text"/>
<div class="absolute right-4 top-1/2 -translate-y-1/2">
<span class="font-label-sm text-primary cursor-pointer hover:underline">Verify</span>
</div>
</div>
<p class="font-label-sm text-secondary-fixed-dim text-right mt-1">Enter the 6-digit code from your app</p>
</div>
<!-- Login Action -->

<span>SECURE ACCESS</span>

<script>
        // Simple micro-interaction for the login form
        const loginBtn = document.querySelector('.glow-button');
        const inputs = document.querySelectorAll('input');

        loginBtn.addEventListener('click', (e) => {
            const originalContent = loginBtn.innerHTML;
            loginBtn.innerHTML = `
                <span class="flex items-center gap-2">
                    <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    AUTHENTICATING...
                </span>
            `;
            
            setTimeout(() => {
                loginBtn.innerHTML = `
                    <span class="flex items-center gap-2">
                        <span class="material-symbols-outlined" data-icon="check_circle">check_circle</span>
                        ACCESS GRANTED
                    </span>
                `;
                loginBtn.classList.remove('bg-primary');
                loginBtn.classList.add('bg-on-tertiary-container');
            }, 1800);
        });

        // Focus ring visual enhancement
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.classList.add('scale-[1.01]');
            });
            input.addEventListener('blur', () => {
                input.parentElement.classList.remove('scale-[1.01]');
            });
        });
    </script>
